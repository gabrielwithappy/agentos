[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "textual>=6.0.0",
]

[project.scripts]
agentos = "agentos.cli:app"
aos = "agentos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos", "catalog"]

[tool.hatch.build.targets.wheel.force-include]
".agents/hooks/scripts/check-careful.sh" = "agentos/_hooks_bundle/hooks/scripts/check-careful.sh"
".agents/hooks/scripts/check-alignment.py" = "agentos/_hooks_bundle/hooks/scripts/check-alignment.py"
".agents/hooks/scripts/post_tool_use_review.py" = "agentos/_hooks_bundle/hooks/scripts/post_tool_use_review.py"
".agents/hooks/scripts/stop_review_gate.py" = "agentos/_hooks_bundle/hooks/scripts/stop_review_gate.py"
".agents/skills/harness/writing-plans/scripts/review_artifacts.py" = "agentos/_hooks_bundle/skills/harness/writing-plans/scripts/review_artifacts.py"
".agents/agents/harness" = "agentos/_harness_bundle/agents/harness"
".agents/skills/harness" = "agentos/_harness_bundle/skills/harness"

[tool.hatch.build.targets.sdist]
include = [
    "/agentos",
    "/catalog",
    "/.agents/hooks/scripts/check-careful.sh",
    "/.agents/hooks/scripts/check-alignment.py",
    "/.agents/hooks/scripts/post_tool_use_review.py",
    "/.agents/hooks/scripts/stop_review_gate.py",
    "/.agents/skills/harness/writing-plans/scripts/review_artifacts.py",
    "/.agents/agents/harness",
    "/.agents/skills/harness",
]

[tool.hatch.build]
include = [
    "/agentos",
    "/catalog",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
